<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>מונה נסיעות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14202B">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Suez+One&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14202B;
    --paper:#EFE3C8;
    --paper-dim:#E3D5B4;
    --brass:#D98E3F;
    --green:#4C7A5E;
    --blue:#2F5D82;
    --rust:#B5562B;
    --line:#2A3C4C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Heebo', sans-serif;
    min-height:100vh;
    padding:20px 16px 40px;
    -webkit-user-select:none; user-select:none;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  header{ text-align:center; margin-bottom:22px; }
  header h1{
    font-family:'Suez One', serif;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  header p{
    margin:0; font-size:13px; color:var(--paper-dim); opacity:.75;
  }

  .stub{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:stretch;
  }
  .stub .tag{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    padding:14px 8px;
    font-size:13px;
    font-weight:700;
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:1px;
    min-width:34px;
  }
  .stub.city .tag{ background:var(--green); }
  .stub.inter .tag{ background:var(--rust); }
  .stub.train .tag{ background:var(--blue); }

  .stub .perf{
    width:0;
    border-left:2px dashed var(--ink);
    opacity:.25;
  }

  .stub button.tapbtn{
    flex:1;
    background:none;
    border:none;
    padding:18px 14px;
    text-align:right;
    display:flex;
    flex-direction:column;
    gap:2px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .stub button.tapbtn:active{ background:rgba(0,0,0,.06); }
  .stub .name{ font-size:18px; font-weight:700; }
  .stub .sub{ font-size:12.5px; opacity:.65; }
  .stub .price{ font-size:13px; margin-top:2px; opacity:.8; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--brass); color:var(--ink); font-weight:700;
    padding:10px 22px; border-radius:999px; font-size:14px;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  section.panel{
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-top:22px;
  }
  .panel h2{
    font-size:13px; margin:0 0 12px; letter-spacing:.3px;
    color:var(--paper-dim); font-weight:500;
  }
  .statrow{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); }
  .statrow:last-child{ border-bottom:none; }
  .statrow .label{ font-size:14px; color:var(--paper-dim); }
  .statrow .val{ font-size:16px; font-weight:600; }

  .headline{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  }
  .headline .big{ font-size:30px; font-weight:600; }
  .headline .small{ font-size:12px; color:var(--paper-dim); }
  .win{ color:#8FBF9F; }
  .lose{ color:#E3897A; }

  .history{ margin-top:22px; }
  .hrow{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .hrow:last-child{ border-bottom:none; }
  .hrow .type{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.city{ background:var(--green); } .dot.inter{ background:var(--rust); } .dot.train{ background:var(--blue); }
  .hrow .when{ color:var(--paper-dim); font-size:12px; }
  .hrow button{
    background:none; border:none; color:var(--rust); font-size:12px; cursor:pointer; padding:4px 8px;
  }
  .empty{ text-align:center; color:var(--paper-dim); font-size:13px; padding:14px 0; opacity:.7; }

  .gear{
    position:fixed; top:16px; left:16px; background:none; border:none;
    color:var(--paper-dim); font-size:20px; cursor:pointer; opacity:.6; padding:6px;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(10,15,20,.92);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
    z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--ink); border:1px solid var(--line); border-radius:18px 18px 0 0;
    width:100%; max-width:480px; padding:22px 18px 30px; max-height:85vh; overflow-y:auto;
  }
  .sheet h3{ font-family:'Suez One', serif; font-size:20px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--paper-dim); margin-bottom:5px; }
  .field input{
    width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line);
    color:var(--paper); border-radius:9px; padding:11px 12px; font-size:16px;
    font-family:'IBM Plex Mono', monospace;
  }
  .field input:focus{ outline:1px solid var(--brass); }
  .sheet .row2{ display:flex; gap:10px; }
  .sheet .row2 .field{ flex:1; }
  .savebtn{
    width:100%; background:var(--brass); color:var(--ink); border:none;
    padding:13px; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px;
  }
  .closebtn{
    width:100%; background:none; color:var(--paper-dim); border:none;
    padding:10px; font-size:13px; cursor:pointer; margin-top:4px;
  }
</style>
</head>
<body>

<button class="gear" id="gearBtn" aria-label="הגדרות">⚙</button>

<header>
  <h1>מונה נסיעות</h1>
  <p>לחיצה אחת מתעדת נסיעה — ובודקת אם החופשי החודשי משתלם</p>
</header>

<div class="stub city">
  <div class="tag">עירוני</div>
  <div class="perf"></div>
  <button class="tapbtn" data-type="city">
    <span class="name">אוטובוס עירוני</span>
    <span class="sub" id="priceCityLabel">—</span>
  </button>
</div>

<div class="stub inter">
  <div class="tag">בין עירוני</div>
  <div class="perf"></div>
  <button class="tapbtn" data-type="inter">
    <span class="name">קו בין-עירוני</span>
    <span class="sub" id="priceInterLabel">—</span>
  </button>
</div>

<div class="stub train">
  <div class="tag">רכבת</div>
  <div class="perf"></div>
  <button class="tapbtn" data-type="train">
    <span class="name">רכבת ישראל</span>
    <span class="sub" id="priceTrainLabel">—</span>
  </button>
</div>

<section class="panel">
  <h2>החודש הזה</h2>
  <div class="statrow"><span class="label">עירוני</span><span class="val mono" id="cCity">0</span></div>
  <div class="statrow"><span class="label">בין-עירוני</span><span class="val mono" id="cInter">0</span></div>
  <div class="statrow"><span class="label">רכבת</span><span class="val mono" id="cTrain">0</span></div>
  <div class="statrow"><span class="label">היה עולה בתשלום בודד</span><span class="val mono" id="cCost">₪0</span></div>
  <div class="statrow"><span class="label">מחיר החופשי החודשי</span><span class="val mono" id="cPass">₪0</span></div>
  <div class="headline">
    <div>
      <div class="small">חיסכון בפועל</div>
      <div class="big mono" id="cSaving">₪0</div>
    </div>
  </div>
</section>

<section class="panel history">
  <h2>נסיעות אחרונות</h2>
  <div id="historyList"><div class="empty">עדיין אין נסיעות מתועדות</div></div>
</section>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>הגדרות מחירים</h3>
    <div class="field">
      <label>מחיר נסיעה עירונית בודדת (₪)</label>
      <input type="number" inputmode="decimal" id="setCity" placeholder="לדוגמה 6.5">
    </div>
    <div class="field">
      <label>מחיר נסיעה בין-עירונית בודדת (₪)</label>
      <input type="number" inputmode="decimal" id="setInter" placeholder="לדוגמה 13.5">
    </div>
    <div class="field">
      <label>מחיר נסיעת רכבת בודדת (₪)</label>
      <input type="number" inputmode="decimal" id="setTrain" placeholder="לדוגמה 15.5">
    </div>
    <div class="field">
      <label>מחיר החופשי החודשי (₪)</label>
      <input type="number" inputmode="decimal" id="setPass" placeholder="לדוגמה 225">
    </div>
    <button class="savebtn" id="saveSettings">שמירה</button>
    <button class="closebtn" id="closeSettings">סגירה</button>
  </div>
</div>

<script>
const STORE_KEY = 'tripTracker.trips';
const SETTINGS_KEY = 'tripTracker.settings';
const TYPE_LABEL = { city:'עירוני', inter:'בין-עירוני', train:'רכבת' };

function loadTrips(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveTrips(trips){ localStorage.setItem(STORE_KEY, JSON.stringify(trips)); }

function loadSettings(){
  try {
    return Object.assign({city:0, inter:0, train:0, pass:0}, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {});
  } catch(e){ return {city:0, inter:0, train:0, pass:0}; }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

let trips = loadTrips();
let settings = loadSettings();

function fmt(n){
  return '₪' + (Math.round(n*10)/10).toLocaleString('he-IL');
}

function monthKey(d){ return d.getFullYear() + '-' + d.getMonth(); }

function currentMonthTrips(){
  const now = new Date();
  const key = monthKey(now);
  return trips.filter(t => monthKey(new Date(t.ts)) === key);
}

function render(){
  document.getElementById('priceCityLabel').textContent = settings.city ? fmt(settings.city) + ' לנסיעה' : 'הגדר מחיר בהגדרות';
  document.getElementById('priceInterLabel').textContent = settings.inter ? fmt(settings.inter) + ' לנסיעה' : 'הגדר מחיר בהגדרות';
  document.getElementById('priceTrainLabel').textContent = settings.train ? fmt(settings.train) + ' לנסיעה' : 'הגדר מחיר בהגדרות';

  const mt = currentMonthTrips();
  const counts = {city:0, inter:0, train:0};
  mt.forEach(t => counts[t.type]++);
  document.getElementById('cCity').textContent = counts.city;
  document.getElementById('cInter').textContent = counts.inter;
  document.getElementById('cTrain').textContent = counts.train;

  const cost = counts.city*settings.city + counts.inter*settings.inter + counts.train*settings.train;
  document.getElementById('cCost').textContent = fmt(cost);
  document.getElementById('cPass').textContent = fmt(settings.pass);

  const saving = cost - settings.pass;
  const savingEl = document.getElementById('cSaving');
  savingEl.textContent = (saving>=0?'':'-') + fmt(Math.abs(saving));
  savingEl.classList.remove('win','lose');
  savingEl.classList.add(saving>=0 ? 'win':'lose');

  const list = document.getElementById('historyList');
  const recent = trips.slice().sort((a,b)=>b.ts-a.ts).slice(0,12);
  if(recent.length===0){
    list.innerHTML = '<div class="empty">עדיין אין נסיעות מתועדות</div>';
  } else {
    list.innerHTML = recent.map(t => {
      const d = new Date(t.ts);
      const when = d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'}) + ' · ' + d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
      return `<div class="hrow">
        <div class="type"><span class="dot ${t.type}"></span>${TYPE_LABEL[t.type]}</div>
        <div class="when mono">${when}</div>
        <button data-del="${t.ts}">מחיקה</button>
      </div>`;
    }).join('');
  }
}

function logTrip(type){
  trips.push({ type, ts: Date.now() });
  saveTrips(trips);
  render();
  showToast('נרשמה נסיעת ' + TYPE_LABEL[type]);
  if(navigator.vibrate) navigator.vibrate(15);
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1600);
}

document.querySelectorAll('.tapbtn').forEach(btn=>{
  btn.addEventListener('click', ()=> logTrip(btn.dataset.type));
});

document.getElementById('historyList').addEventListener('click', (e)=>{
  const ts = e.target.getAttribute('data-del');
  if(ts){
    trips = trips.filter(t => String(t.ts) !== ts);
    saveTrips(trips);
    render();
  }
});

const overlay = document.getElementById('overlay');
document.getElementById('gearBtn').addEventListener('click', ()=>{
  document.getElementById('setCity').value = settings.city || '';
  document.getElementById('setInter').value = settings.inter || '';
  document.getElementById('setTrain').value = settings.train || '';
  document.getElementById('setPass').value = settings.pass || '';
  overlay.classList.add('show');
});
document.getElementById('closeSettings').addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });

document.getElementById('saveSettings').addEventListener('click', ()=>{
  settings = {
    city: parseFloat(document.getElementById('setCity').value) || 0,
    inter: parseFloat(document.getElementById('setInter').value) || 0,
    train: parseFloat(document.getElementById('setTrain').value) || 0,
    pass: parseFloat(document.getElementById('setPass').value) || 0,
  };
  saveSettings(settings);
  overlay.classList.remove('show');
  render();
});

// first run: open settings automatically if nothing configured yet
if(!settings.pass && trips.length===0){
  setTimeout(()=> document.getElementById('gearBtn').click(), 400);
}

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
